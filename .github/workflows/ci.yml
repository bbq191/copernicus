name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # 预处理阶段的测试用真实 ffmpeg 生成小文件验证；缺失时这些测试会被跳过
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 测试全部使用 mock，不需要 GPU；先装 CPU 版 torch，避免下载数 GB 的 CUDA 轮子
      - name: Install CPU-only torch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 安装/卸载脚本只能在真机上完整验证；CI 至少保证语法与静态检查通过
      # 在 deploy/ 下运行：脚本用相对路径 source 同目录的 lib.sh，ShellCheck 才能跟进去
      - name: ShellCheck
        working-directory: deploy
        run: shellcheck -x install.sh uninstall.sh lib.sh
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dry run
        run: sudo deploy/install.sh --dry-run --skip-frontend --no-nginx --python "$(command -v python3)"
