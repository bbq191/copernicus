[project]
name = "copernicus"
version = "0.1.0"
description = "ASR + NLP text correction service"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5",
    "funasr>=1.2,<2.0",
    "modelscope>=1.18,<2.0",
    "torch>=2.4,<3.0",
    "torchaudio>=2.4,<3.0",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "pycorrector>=0.5",
    "transformers>=4.40,<5.0",
    "openpyxl>=3.1",
    "flashtext>=2.7",
    "rapidocr>=3.6",
    "onnxruntime>=1.17,<2.0",
    "ultralytics>=8.3,<9.0",
    "opencv-python-headless>=4.9",
    "pypinyin>=0.51",
    "python-frontmatter>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# 音频重塑（可选）：缺失时启动预检只警告，合成接口不可用
tts = ["ChatTTS>=0.2,<0.3"]
# PyTorch 变体：uv sync 时必须且只能选一个（--extra cpu / cu126 / cu130），否则会装 PyPI 默认构建
# cpu：CI 与无显卡环境；cu126：驱动较旧（≥ 525）的机器；cu130：需驱动 ≥ 580，生产 RTX 2080 Ti 与开发机 RTX 50 系都用它
cpu = ["torch", "torchaudio", "torchvision"]
cu126 = ["torch", "torchaudio", "torchvision"]
cu130 = ["torch", "torchaudio", "torchvision"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copernicus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["models", "uploads"]

[tool.ruff.lint]
# 只启用能发现真实缺陷的规则：语法错误、未定义/未使用名称、导入位置
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 这两处必须先设置环境变量/日志，再导入 torch、funasr 等（导入顺序是有意的）
"src/copernicus/main.py" = ["E402"]
"src/copernicus/services/tts.py" = ["E402"]
"run_dev.py" = ["E402"]
