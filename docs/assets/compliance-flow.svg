<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">合规审核流程</title><desc id="d">规则文件解析后与内置结构化规则匹配，按证据来源分组，转写文本切块并发送给 LLM，结果经过滤器链、评分，最后人工复核并导出</desc><defs><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.5" y="0.5" width="959" height="599" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="30" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="120.0" y="47.5" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="120.0" dy="0.0">规则文件</tspan></text><text x="120.0" y="68.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="120.0" dy="0.0">CSV / XLSX</tspan><tspan x="120.0" dy="15.5">每行一条审核标准</tspan></text><rect x="260" y="30" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="49.6" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">规则解析 + 结构化</tspan></text><text x="370.0" y="69.7" font-size="9.941520467836257" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">按内容关键词匹配内置 13 条规则</tspan><tspan x="370.0" dy="13.4">（精确词 / 语义 / 视觉三种检查模式）</tspan></text><rect x="520" y="30" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="620.0" y="55.2" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="620.0" dy="0.0">按证据来源分组</tspan></text><text x="620.0" y="76.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="620.0" dy="0.0">转写组 · OCR 组 · 混合组</tspan></text><rect x="760" y="30" width="180" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="850.0" y="49.6" font-size="14" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="850.0" dy="0.0">无 OCR 数据？</tspan></text><text x="850.0" y="69.8" font-size="9.903381642512077" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="850.0" dy="0.0">OCR 组跳过，规则 id</tspan><tspan x="850.0" dy="13.4">记入报告 skipped_rule_ids</tspan></text><path d="M220,65 L260,65" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M480,65 L520,65" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M720,65 L760,65" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="20" y="150" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="120.0" y="175.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="120.0" dy="0.0">转写文本</tspan></text><text x="120.0" y="196.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="120.0" dy="0.0">≤ 50000 字，超出截断并标记</tspan></text><rect x="260" y="150" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="176.0" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">切块（4000 字/块）</tspan></text><text x="370.0" y="196.5" font-size="10.303030303030303" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">每块 × 每个规则组 = 一次 LLM 调用</tspan></text><rect x="520" y="150" width="200" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="620.0" y="167.5" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="620.0" dy="0.0">LLM 并发审核</tspan></text><text x="620.0" y="188.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="620.0" dy="0.0">JSON 数组输出</tspan><tspan x="620.0" dy="15.5">格式错误时重问 1 次</tspan></text><rect x="760" y="150" width="180" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="850.0" y="168.7" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="850.0" dy="0.0">某块调用失败</tspan></text><text x="850.0" y="189.3" font-size="10.594315245478036" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="850.0" dy="0.0">失败块计数 failed_chunks</tspan><tspan x="850.0" dy="14.3">全部失败则任务失败</tspan></text><path d="M620,100 L620,130 L370,130 L370,150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M220,185 L260,185" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M480,185 L520,185" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M720,185 L760,185" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mdc2626)"/><rect x="20" y="260" width="920" height="130" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="274.0" font-size="12.5" text-anchor="start" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">后处理过滤器链（按顺序）</tspan></text><rect x="45" y="296" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="140.0" y="321.2" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="140.0" dy="0.0">置信度过滤</tspan></text><text x="140.0" y="342.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="140.0" dy="0.0">低于 0.7 丢弃</tspan></text><path d="M235,331 L269,331" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><rect x="269" y="296" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="364.0" y="313.5" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="364.0" dy="0.0">精确词校验</tspan></text><text x="364.0" y="334.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="364.0" dy="0.0">关键词类规则用</tspan><tspan x="364.0" dy="15.5">拼音窗口二次确认</tspan></text><path d="M459,331 L493,331" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><rect x="493" y="296" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="588.0" y="313.5" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="588.0" dy="0.0">去重合并</tspan></text><text x="588.0" y="334.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="588.0" dy="0.0">30 秒窗口内同规则</tspan><tspan x="588.0" dy="15.5">合并重复命中</tspan></text><path d="M683,331 L717,331" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><rect x="717" y="296" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="812.0" y="313.5" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="812.0" dy="0.0">证据补全</tspan></text><text x="812.0" y="334.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="812.0" dy="0.0">附上最近的 OCR 文字</tspan><tspan x="812.0" dy="15.5">与关键帧截图</tspan></text><path d="M480,220 L480,260" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="20" y="420" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="120.0" y="440.2" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="120.0" dy="0.0">汇总摘要 + 评分</tspan></text><text x="120.0" y="460.0" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="120.0" dy="0.0">100 分起扣：高 15 / 中 8 / 低 3</tspan><tspan x="120.0" dy="12.8">已驳回的不扣分</tspan></text><rect x="260" y="420" width="220" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="370.0" y="437.5" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">人工复核</tspan></text><text x="370.0" y="458.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">确认 / 忽略 / 备注</tspan><tspan x="370.0" dy="15.5">回到待审会清空留痕</tspan></text><rect x="520" y="420" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="620.0" y="437.5" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="620.0" dy="0.0">服务端重算评分</tspan></text><text x="620.0" y="458.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="620.0" dy="0.0">每次复核后持久化</tspan><tspan x="620.0" dy="15.5">并返回最新评分</tspan></text><rect x="760" y="420" width="180" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="850.0" y="437.5" font-size="14" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="850.0" dy="0.0">导出 Excel</tspan></text><text x="850.0" y="458.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="850.0" dy="0.0">概览 + 违规明细 + 复核</tspan><tspan x="850.0" dy="15.5">公式注入已防护</tspan></text><path d="M480,390 L480,405 L120,405 L120,420" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M220,455 L260,455" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M480,455 L520,455" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M720,455 L760,455" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><text x="480" y="526.0" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">证据来源只有“转写文本”和“OCR 屏幕文字”两路；人脸检测事件目前会保存，但不参与合规判定</tspan></text><text x="480" y="552.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">违规条目带稳定 id（v0001…），复核、导出、前端选中都按 id 对应，不会因排序或筛选错位</tspan></text></svg>
