<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">并发控制：各阶段的闸门</title><desc id="d">音视频任务先过排队上限，再在各阶段遇到不同的闸门：ASR 串行、视觉推理串行、LLM 全局并发上限、TTS 独占显存</desc><defs><marker id="m0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="20" width="200" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="120.0" y="40.2" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="120.0" dy="0.0">HTTP 请求 / 新任务</tspan></text><text x="120.0" y="61.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="120.0" dy="0.0">上传、重转写</tspan></text><rect x="270" y="20" width="250" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="395.0" y="32.5" font-size="12.5" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="395.0" dy="0.0">排队上限 TASK_MAX_ACTIVE = 5</tspan></text><text x="395.0" y="52.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="395.0" dy="0.0">排队 + 运行中的音视频任务；</tspan><tspan x="395.0" dy="15.5">超出 → 429（0 表示不限制）</tspan></text><rect x="570" y="20" width="180" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="660.0" y="40.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="660.0" dy="0.0">每任务一个协程</tspan></text><text x="660.0" y="61.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="660.0" dy="0.0">超时 3600 s（含排队）</tspan></text><path d="M220,50 L270,50" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M520,50 L570,50" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><text x="850" y="42.2" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="850" dy="0.0">文本评估 / 合规审核任务</tspan><tspan x="850" dy="15.5">不占排队名额</tspan></text><text x="480" y="112.0" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="480" dy="0.0">同一时刻，多个任务的各个阶段会在下面这些资源上交汇</tspan></text><rect x="20" y="132" width="230" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="160.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="135.0" dy="0.0">ffmpeg 子进程</tspan></text><text x="135.0" y="181.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="135.0" dy="0.0">格式转换 · 抽帧 · 编码</tspan></text><rect x="270" y="132" width="560" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="170.0" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="550.0" dy="0.0">每个任务各自启动，不设闸门；由 CPU 核数自然限流</tspan></text><rect x="866.6" y="158.6" width="56.9" height="22.8" rx="11.4" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="895" y="170.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="895" dy="0.0">无闸门</tspan></text><path d="M250,170 L270,170" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="20" y="224" width="230" height="76" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="135.0" y="252.2" font-size="14" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="135.0" dy="0.0">视觉推理 OCR / YOLO</tspan></text><text x="135.0" y="273.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="135.0" dy="0.0">关键帧逐张推理（CPU）</tspan></text><rect x="270" y="224" width="560" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="262.0" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="550.0" dy="0.0">模型内部加锁，全局串行：多任务同时推理只会互相抢核，更耗电</tspan></text><rect x="873.0" y="250.6" width="43.9" height="22.8" rx="11.4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/><text x="895" y="262.0" font-size="12" text-anchor="middle" fill="#134e4a" font-weight="normal" dominant-baseline="central"><tspan x="895" dy="0.0">串行</tspan></text><path d="M250,262 L270,262" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#m0d9488)"/><rect x="20" y="316" width="230" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="135.0" y="344.2" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="135.0" dy="0.0">ASR 语音识别</tspan></text><text x="135.0" y="365.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="135.0" dy="0.0">GPU · 线程内运行，不可中断</tspan></text><rect x="270" y="316" width="560" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="354.0" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="550.0" dy="0.0">ModelManager 的“asr 使用锁”，先到先得（FIFO）；持锁期间模型不会被卸载</tspan></text><rect x="873.0" y="342.6" width="43.9" height="22.8" rx="11.4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="895" y="354.0" font-size="12" text-anchor="middle" fill="#14532d" font-weight="normal" dominant-baseline="central"><tspan x="895" dy="0.0">串行</tspan></text><path d="M250,354 L270,354" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><rect x="20" y="408" width="230" height="76" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="135.0" y="436.2" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="135.0" dy="0.0">LLM 调用</tspan></text><text x="135.0" y="457.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="135.0" dy="0.0">纠正 · 纪要 · 合规 · 改写</tspan></text><rect x="270" y="408" width="560" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="446.0" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="550.0" dy="0.0">全局信号量 LLM_MAX_CONCURRENT = 3；纠正批次另受 correction_max_concurrency = 3 限制</tspan></text><rect x="853.6" y="434.6" width="82.8" height="22.8" rx="11.4" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="895" y="446.0" font-size="12" text-anchor="middle" fill="#7c2d12" font-weight="normal" dominant-baseline="central"><tspan x="895" dy="0.0">≤ 3 并发</tspan></text><path d="M250,446 L270,446" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><rect x="20" y="500" width="230" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="135.0" y="528.2" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="135.0" dy="0.0">TTS 音频重塑</tspan></text><text x="135.0" y="549.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="135.0" dy="0.0">GPU · ChatTTS</tspan></text><rect x="270" y="500" width="560" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="550.0" dy="0.0">“tts 使用锁” + 独占：先等 ASR 使用者结束并卸载 ASR，合成完立即卸载 TTS</tspan></text><rect x="860.1" y="526.6" width="69.8" height="22.8" rx="11.4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="895" y="538.0" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="normal" dominant-baseline="central"><tspan x="895" dy="0.0">独占显存</tspan></text><path d="M250,538 L270,538" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><text x="480" y="606.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">被取消的任务：还在排队等 ASR 锁的不会占用 GPU；已经在 ASR 线程里的，会等线程跑完才释放锁，避免两路推理并行</tspan></text></svg>
