<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">四阶段文本纠正</title><desc id="d">规则预处理、热词替换、MacBERT 纠错、LLM 润色；置信度高的句段直接跳过，LLM 失败时保留前三阶段结果并提示</desc><defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="399" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="30" y="20" width="900" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="480.0" y="33.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="480.0" dy="0.0">ASR 输出的句段</tspan></text><text x="480.0" y="54.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480.0" dy="0.0">每句带置信度：≥ 0.95 的句段直接跳过后三步（省 LLM 调用）</tspan></text><path d="M480,66 L480,96" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="521.5" y="72.4" width="77.0" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="560" y="81.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="560" dy="0.0">低置信度句段</tspan></text><rect x="30" y="96" width="204" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="132.0" y="139.0" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="132.0" dy="0.0">① 规则预处理</tspan></text><text x="132.0" y="159.1" font-size="9.853249475890985" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="132.0" dy="0.0">去英文噪声词 · 合并重复词</tspan><tspan x="132.0" dy="13.3">（那个那个→那个）· 数字年份规范化</tspan><tspan x="132.0" dy="13.3">纯噪声句段直接判空</tspan></text><rect x="66.3" y="236.0" width="131.4" height="19.9" rx="10.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="132" y="246.0" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="132" dy="0.0">本机 CPU · 毫秒级</tspan></text><rect x="262" y="96" width="204" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="364.0" y="135.7" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="364.0" dy="0.0">② 热词替换</tspan></text><text x="364.0" y="156.9" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="364.0" dy="0.0">FlashText 多模式匹配</tspan><tspan x="364.0" dy="15.5">把预设热词改成正确写法</tspan><tspan x="364.0" dy="15.5">（公司名、产品名、术语）</tspan></text><rect x="298.3" y="236.0" width="131.4" height="19.9" rx="10.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="364" y="246.0" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="364" dy="0.0">本机 CPU · 毫秒级</tspan></text><rect x="494" y="96" width="204" height="130" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="596.0" y="135.7" font-size="14" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="596.0" dy="0.0">③ MacBERT 纠错</tspan></text><text x="596.0" y="156.9" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="596.0" dy="0.0">pycorrector 检查同音字</tspan><tspan x="596.0" dy="15.5">形近字错误</tspan><tspan x="596.0" dy="15.5">首次调用才加载模型</tspan></text><rect x="528.4" y="236.0" width="135.2" height="19.9" rx="10.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="596" y="246.0" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="596" dy="0.0">本机 · 工作线程执行</tspan></text><rect x="726" y="96" width="204" height="130" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="828.0" y="139.8" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="828.0" dy="0.0">④ LLM 润色</tspan></text><text x="828.0" y="159.6" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="828.0" dy="0.0">JSON 进 JSON 出：去口语、</tspan><tspan x="828.0" dy="12.8">补标点、修倒装；id 必须一一对应</tspan><tspan x="828.0" dy="12.8">≤15 条 / ≤800 字为一批，最多 3 批并发</tspan></text><rect x="754.7" y="236.0" width="146.5" height="19.9" rx="10.0" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="828" y="246.0" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="828" dy="0.0">LLM · 受全局并发限制</tspan></text><path d="M234,161 L262,161" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M466,161 L494,161" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M698,161 L726,161" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="20" y="274" width="920" height="108" rx="14" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="288.0" font-size="12.5" text-anchor="start" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">降级与容错</tspan></text><text x="40" y="310.0" font-size="12.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="40" dy="0.0">• LLM 输出不是合法 JSON → 尝试用正则抢救可识别的条目；抢救不到 → 整批保留前三阶段的结果</tspan></text><text x="40" y="336.0" font-size="12.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="40" dy="0.0">• 某一批 LLM 调用失败（含重试后）→ 只影响该批，其余批次照常；失败批次数写入转写结果</tspan></text><text x="40" y="362.0" font-size="12.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="40" dy="0.0">• 前端在转写工具栏显示“x / y 批文本的 LLM 润色失败”，避免把未润色的文本误认为已润色</tspan></text></svg>
