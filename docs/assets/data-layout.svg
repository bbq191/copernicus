<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">磁盘数据布局与自动清理</title><desc id="d">uploads 目录下每个任务一个子目录，保存媒体与各类 JSON；每小时按四种策略清理</desc><defs></defs><rect x="0.5" y="0.5" width="959" height="659" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="20" width="520" height="620" rx="14" fill="none" stroke="#ca8a04" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="34.0" font-size="12.5" text-anchor="start" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">uploads/（UPLOAD_DIR，无数据库，全部是文件）</tspan></text><rect x="44" y="66" width="470" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="279.0" y="84.0" font-size="11.36136136136136" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="279.0" dy="0.0">hash_index.json  —  文件 SHA-256 → task_id，用于重复上传去重</tspan></text><rect x="44" y="108" width="470" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="279.0" y="126.0" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="279.0" dy="0.0">.sessions/{hash}/  —  分片上传会话：session.json + data.bin（断点续传）</tspan></text><rect x="44" y="150" width="470" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="279.0" y="168.0" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="normal" dominant-baseline="central"><tspan x="279.0" dy="0.0">.incoming/  —  表单上传的临时文件（收完即移入任务目录）</tspan></text><rect x="44" y="200" width="470" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="279.0" y="215.0" font-size="13" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="279.0" dy="0.0">{task_id}/  每个任务一个目录</tspan></text><rect x="70" y="240" width="444" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="292.0" y="249.9" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">meta.json</tspan></text><text x="292.0" y="269.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">文件名 · 哈希 · 创建时间 · 显示名</tspan></text><rect x="70" y="280" width="444" height="38" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="292.0" y="289.9" font-size="12" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">audio.* / video.*</tspan></text><text x="292.0" y="309.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">原始媒体 → 到期删除</tspan></text><rect x="70" y="320" width="444" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="292.0" y="329.9" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">transcript.json</tspan></text><text x="292.0" y="349.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">转写结果（含润色统计）</tspan></text><rect x="70" y="360" width="444" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="292.0" y="369.9" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">evaluation.json</tspan></text><text x="292.0" y="389.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">会议纪要</tspan></text><rect x="70" y="400" width="444" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="292.0" y="409.9" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">compliance.json</tspan></text><text x="292.0" y="429.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">合规报告（含人工复核状态）</tspan></text><rect x="70" y="440" width="444" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="292.0" y="449.9" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">ocr_results.json · visual_events.json · keyframes.json</tspan></text><text x="292.0" y="468.4" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">视觉扫描结果</tspan></text><rect x="70" y="480" width="444" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="292.0" y="489.9" font-size="12" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">frames/</tspan></text><text x="292.0" y="509.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">关键帧 JPEG → 保留（合规证据截图依赖它）</tspan></text><rect x="70" y="520" width="444" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="292.0" y="529.9" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">synthesis.mp3 · synthesis_result.json</tspan></text><text x="292.0" y="549.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">音频重塑产物 → mp3 到期删除</tspan></text><rect x="70" y="560" width="444" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="292.0" y="569.9" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="292.0" dy="0.0">failure.json</tspan></text><text x="292.0" y="589.1" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="292.0" dy="0.0">失败原因（重启后仍可读出）</tspan></text><text x="70" y="622.0" font-size="9.615384615384615" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="70" dy="0.0">处理过程中的 processed.wav / extracted.wav 也在任务目录内，ASR 结束后即删除</tspan></text><rect x="570" y="20" width="370" height="620" rx="14" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/><text x="584" y="34.0" font-size="12.5" text-anchor="start" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="584" dy="0.0">每小时自动清理（LifecycleService）</tspan></text><rect x="590" y="60" width="330" height="118" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="755.0" y="86.0" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="755.0" dy="0.0">① 过期媒体</tspan></text><text x="755.0" y="107.2" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="755.0" dy="0.0">已有转写结果的任务：超过</tspan><tspan x="755.0" dy="15.5">MEDIA_RETENTION_HOURS（默认 24h）</tspan><tspan x="755.0" dy="15.5">删除 audio / video / synthesis.mp3</tspan><tspan x="755.0" dy="15.5">JSON 结果与关键帧保留</tspan></text><rect x="590" y="192" width="330" height="118" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="755.0" y="233.5" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="755.0" dy="0.0">② 失败任务</tspan></text><text x="755.0" y="254.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="755.0" dy="0.0">没有转写结果且超期（至少 2 小时）</tspan><tspan x="755.0" dy="15.5">整个目录删除——留着没有用</tspan></text><rect x="590" y="324" width="330" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="755.0" y="365.5" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="755.0" dy="0.0">③ 上传残留</tspan></text><text x="755.0" y="386.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="755.0" dy="0.0">超期未完成的分片会话</tspan><tspan x="755.0" dy="15.5">表单上传遗留的临时文件</tspan></text><rect x="590" y="456" width="330" height="118" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="755.0" y="489.7" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="755.0" dy="0.0">④ 存储配额</tspan></text><text x="755.0" y="510.9" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="755.0" dy="0.0">MAX_STORAGE_GB &gt; 0 且超限时：</tspan><tspan x="755.0" dy="15.5">从最旧的任务开始删原始媒体</tspan><tspan x="755.0" dy="15.5">直到回落到配额内（默认不限制）</tspan></text></svg>
