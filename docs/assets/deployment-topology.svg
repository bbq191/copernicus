<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">生产部署拓扑</title><desc id="d">浏览器访问 Nginx；Nginx 提供静态页面并反向代理到本机回环的后端；后端使用本机 GPU、Ollama 与磁盘</desc><defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="mca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker></defs><rect x="0.5" y="0.5" width="959" height="649" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="240" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="90.0" y="265.5" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="90.0" dy="0.0">浏览器</tspan></text><text x="90.0" y="286.4" font-size="11.11111111111111" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="90.0" dy="0.0">访问 http://服务器</tspan></text><rect x="200" y="20" width="740" height="580" rx="14" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/><text x="214" y="34.0" font-size="12.5" text-anchor="start" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="214" dy="0.0">服务器（Rocky Linux，systemd 管理）</tspan></text><rect x="230" y="240" width="200" height="130" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="330.0" y="264.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="330.0" dy="0.0">Nginx  :80</tspan></text><text x="330.0" y="285.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="330.0" dy="0.0">/  →  静态页面</tspan><tspan x="330.0" dy="15.5">/assets/ 缓存 1 年</tspan><tspan x="330.0" dy="15.5">/api/  →  后端</tspan><tspan x="330.0" dy="15.5">上传、下载长超时、不缓冲</tspan><tspan x="330.0" dy="15.5">/docs 仅本机可访问</tspan></text><path d="M160,275 L230,275" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="178.1" y="249.4" width="33.8" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="195" y="258.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="195" dy="0.0">HTTP</tspan></text><rect x="480" y="200" width="230" height="210" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="595.0" y="270.9" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="595.0" dy="0.0">copernicus-backend</tspan></text><text x="595.0" y="290.8" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="595.0" dy="0.0">systemd 服务 · 用户 copernicus</tspan><tspan x="595.0" dy="12.8">uvicorn 127.0.0.1:8000 · 单 worker</tspan><tspan x="595.0" dy="12.8">配置：backend/.env</tspan><tspan x="595.0" dy="12.8">失败自动重启（10 秒，限次）</tspan><tspan x="595.0" dy="12.8">日志进 journald · 关停给 60 秒收尾</tspan></text><path d="M430,305 L480,305" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="438.1" y="279.4" width="33.8" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="455" y="288.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="455" dy="0.0">/api</tspan></text><rect x="750" y="60" width="170" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="83