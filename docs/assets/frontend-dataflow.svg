<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">前端关键数据流</title><desc id="d">打开任务时的恢复与轮询；复核结果的防抖持久化；切换任务时取消旧任务的在途请求</desc><defs><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="699" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="20" width="920" height="200" rx="14" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="34.0" font-size="12.5" text-anchor="start" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">① 打开任务：先恢复，恢复不了再轮询</tspan></text><rect x="40" y="60" width="125" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="102.5" y="87.6" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="102.5" dy="0.0">路由</tspan><tspan x="102.5" dy="14.9">/workspace/:id</tspan></text><rect x="190" y="60" width="125" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="252.5" y="78.8" font-size="12" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="252.5" dy="0.0">切换了任务？</tspan><tspan x="252.5" dy="16.2">重置全部状态</tspan><tspan x="252.5" dy="16.2">并取消旧请求</tspan></text><rect x="340" y="60" width="125" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="402.5" y="87.4" font-size="11.213991769547324" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="402.5" dy="0.0">读取已保存结果</tspan><tspan x="402.5" dy="15.1">GET …/results</tspan></text><rect x="490" y="60" width="125" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="552.5" y="95.0" font-size="12" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="552.5" dy="0.0">有转写结果？</tspan></text><rect x="640" y="60" width="125" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="702.5" y="86.9" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="702.5" dy="0.0">hydrate 恢复</tspan><tspan x="702.5" dy="16.2">纪要·合规·转写</tspan></text><rect x="790" y="60" width="125" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="852.5" y="95.0" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="852.5" dy="0.0">显示工作区</tspan></text><path d="M165,95 L190,95" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M315,95 L340,95" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M465,95 L490,95" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M615,95 L640,95" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><text x="627" y="80.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="627" dy="0.0">有</tspan></text><path d="M765,95 L790,95" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="490" y="152" width="125" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="552.5" y="164.5" font-size="12" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="552.5" dy="0.0">轮询状态</tspan></text><text x="552.5" y="183.4" font-size="10" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="552.5" dy="0.0">前台 2 秒</tspan><tspan x="552.5" dy="13.5">后台 10 秒</tspan></text><path d="M552,130 L552,152" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><text x="575" y="141.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="575" dy="0.0">没有</tspan></text><path d="M615,180 L702,180 L702,130" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><rect x="722.2" y="189.1" width="135.7" height="15.8" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="790" y="197.0" font-size="10.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="790" dy="0.0">completed → 再拉取结果</tspan></text><text x="230" y="172.2" font-size="11.5" text-anchor="middle" fill="#7f1d1d" font-weight="normal" dominant-baseline="central"><tspan x="230" dy="0.0">failed → 错误页</tspan><tspan x="230" dy="15.5">连续 5 次网络失败才放弃轮询</tspan></text><rect x="20" y="240" width="920" height="190" rx="14" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="254.0" font-size="12.5" text-anchor="start" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">② 违规复核：本地立即生效，后台可靠保存</tspan></text><rect x="35" y="282" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="110.0" y="309.6" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="110.0" dy="0.0">点击 确认/忽略</tspan><tspan x="110.0" dy="14.9">或按 Enter / Delete</tspan></text><rect x="220" y="282" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="295.0" y="309.4" font-size="11.279461279461279" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="295.0" dy="0.0">乐观更新界面</tspan><tspan x="295.0" dy="15.2">（列表、统计立即变化）</tspan></text><rect x="405" y="282" width="150" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="480.0" y="308.9" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="480.0" dy="0.0">ReviewPersister</tspan><tspan x="480.0" dy="16.2">按任务绑定入队</tspan></text><rect x="590" y="282" width="150" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="665.0" y="308.9" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="665.0" dy="0.0">防抖 500ms</tspan><tspan x="665.0" dy="16.2">同一违规只留最后一次</tspan></text><rect x="775" y="282" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="850.0" y="308.9" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="850.0" dy="0.0">串行 PATCH</tspan><tspan x="850.0" dy="16.2">服务端重算评分</tspan></text><path d="M185,317 L220,317" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M370,317 L405,317" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M555,317 L590,317" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M740,317 L775,317" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><text x="480" y="380.0" font-size="11.5" text-anchor="middle" fill="#166534" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">失败：放回队列，指数退避重试（最多 3 次）并提示；重试期间的新修改优先</tspan></text><text x="480" y="406.0" font-size="11.5" text-anchor="middle" fill="#166534" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">标签页转入后台或即将关闭：立即用 keepalive 请求提交，防止 500ms 窗口内的修改丢失</tspan></text><rect x="20" y="450" width="920" height="230" rx="14" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="464.0" font-size="12.5" text-anchor="start" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">③ 切换任务 / 回到首页：取消旧任务的一切</tspan></text><rect x="40" y="496" width="200" height="84" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="140.0" y="521.1" font-size="13" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="140.0" dy="0.0">长耗时请求</tspan></text><text x="140.0" y="541.4" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="140.0" dy="0.0">摘要评估 · 合规审核</tspan><tspan x="140.0" dy="14.9">发起时取 taskScope 信号</tspan></text><rect x="260" y="496" width="200" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="360.0" y="521.1" font-size="12.777777777777779" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="360.0" dy="0.0">resetWorkspaceStores</tspan></text><text x="360.0" y="541.2" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="360.0" dy="0.0">先补交未保存的复核</tspan><tspan x="360.0" dy="14.9">再 cancelTaskWork()</tspan></text><rect x="480" y="496" width="200" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="580.0" y="521.1" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="580.0" dy="0.0">AbortSignal 触发</tspan></text><text x="580.0" y="541.4" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="580.0" dy="0.0">轮询停止 · 等待被打断</tspan><tspan x="580.0" dy="14.9">在途响应被丢弃</tspan></text><rect x="700" y="496" width="200" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="800.0" y="521.1" font-size="13" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="800.0" dy="0.0">新任务干净起步</tspan></text><text x="800.0" y="541.4" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="800.0" dy="0.0">旧任务的结果不会</tspan><tspan x="800.0" dy="14.9">写进新任务的界面</tspan></text><path d="M240,538 L260,538" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mdc2626)"/><path d="M460,538 L480,538" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mdc2626)"/><path d="M680,538 L700,538" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mdc2626)"/><text x="480" y="610.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">组件卸载（如切换右侧标签页）不会取消这些请求——进度要保留；只有“换任务”才会取消</tspan></text><text x="480" y="640.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">另：WorkspacePage 在路由已换、状态还没重置的那一帧显示骨架屏，避免用上一个任务的数据渲染并加载旧媒体</tspan></text></svg>
