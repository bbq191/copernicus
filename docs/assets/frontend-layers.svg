<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">前端分层结构</title><desc id="d">页面、组件、hooks、状态仓库、API 层与后端 REST 的依赖方向：上层依赖下层</desc><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="20" width="700" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="45.1" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">页面  pages</tspan></text><text x="370.0" y="66.7" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">HomePage（上传 + 历史）· WorkspacePage（工作区）· HealthPage（服务状态）</tspan><tspan x="370.0" dy="14.9">路由按页懒加载，外层有 ErrorBoundary</tspan></text><rect x="20" y="120" width="700" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="137.7" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">组件  components</tspan></text><text x="370.0" y="159.3" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">layout（三栏布局）· player（播放器/波形/进度条）· transcript（转写列表/校对）</tspan><tspan x="370.0" dy="14.9">summary · compliance（违规工作台）· synthesis · upload</tspan><tspan x="370.0" dy="14.9">shared（错误条/进度块/主题切换/Toast）</tspan></text><rect x="20" y="220" width="700" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="370.0" y="245.2" font-size="15" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">Hooks  hooks</tspan></text><text x="370.0" y="266.7" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">useTaskPolling · usePolling（后台降频）· useAudioSync · useAutoScroll · useWaveSurfer</tspan><tspan x="370.0" dy="14.9">useTranscriptEditing · useAuditKeyboard · useTaskHistory · useTemplates · useExport</tspan></text><rect x="20" y="320" width="700" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="370.0" y="337.7" font-size="15" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">状态仓库  stores（Zustand）</tspan></text><text x="370.0" y="359.3" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">task · transcript · evaluation · compliance · player · synthesis · toast</tspan><tspan x="370.0" dy="14.9">配套：taskScope（取消范围）· reviewPersister（复核持久化）</tspan><tspan x="370.0" dy="14.9">hydrateWorkspace（恢复结果）· resetWorkspace（切换重置）</tspan></text><rect x="20" y="420" width="700" height="84" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="370.0" y="437.7" font-size="15" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">API 层  api</tspan></text><text x="370.0" y="459.3" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">client（axios，基址 /api/v1）· task · compliance · evaluation · synthesis</tspan><tspan x="370.0" dy="14.9">templates · health · errors · polling（可中止、后台降频）</tspan><tspan x="370.0" dy="14.9">不依赖 UI 状态：进度通过回调参数交给调用方</tspan></text><path d="M370,104 L370,120" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M370,204 L370,220" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M370,304 L370,320" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M370,404 L370,420" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="20" y="520" width="700" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="370.0" y="533.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="370.0" dy="0.0">后端 REST API  /api/v1</tspan></text><text x="370.0" y="554.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="370.0" dy="0.0">Nginx 同源代理；开发时由 Vite 代理到 localhost:8000</tspan></text><path d="M370,504 L370,520" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="750" y="20" width="190" height="484" rx="14" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/><text x="764" y="34.0" font-size="12.5" text-anchor="start" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="764" dy="0.0">旁路</tspan></text><rect x="765" y="60" width="160" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="845.0" y="90.5" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="845.0" dy="0.0">utils 工具</tspan></text><text x="845.0" y="111.5" font-size="11.111111111111109" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="845.0" dy="0.0">格式化 · 违规筛选/统计</tspan><tspan x="845.0" dy="15.0">播放跳转 · 完整性提示</tspan><tspan x="845.0" dy="15.0">localStorage 容错</tspan></text><rect x="765" y="190" width="160" height="110" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="845.0" y="221.7" font-size="14" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="845.0" dy="0.0">导出（懒加载）</tspan></text><text x="845.0" y="242.2" font-size="10.526315789473685" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="845.0" dy="0.0">SRT · Word(docx)</tspan><tspan x="845.0" dy="14.2">PDF(jsPDF + canvas)</tspan><tspan x="845.0" dy="14.2">只在点击导出时下载</tspan></text><rect x="765" y="320" width="160" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="845.0" y="351.7" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="845.0" dy="0.0">上传工具</tspan></text><text x="845.0" y="372.2" font-size="10.526315789473685" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="845.0" dy="0.0">SHA-256（hash-wasm）</tspan><tspan x="845.0" dy="14.2">分片上传 5MB/块</tspan><tspan x="845.0" dy="14.2">断点续传与重试</tspan></text><text x="845" y="454.2" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="845" dy="0.0">依赖方向：上 → 下</tspan><tspan x="845" dy="15.5">下层不反向依赖 UI</tspan></text><text x="20" y="600.0" font-size="12" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="20" dy="0.0">首屏只加载首页所需代码；工作区、健康页与导出库都是按需加载的独立块，可显著降低首次打开的体积</tspan></text></svg>
