<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">install.sh 与 uninstall.sh 做了什么</title><desc id="d">安装脚本依次完成检查、创建用户、准备配置与 Python 环境、构建前端、注册服务；卸载脚本反向撤销，默认保留数据</desc><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="20" width="560" height="600" rx="14" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="34.0" font-size="12.5" text-anchor="start" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">sudo deploy/install.sh（可重复执行，--dry-run 只预演）</tspan></text><rect x="40" y="60" width="520" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="300.0" y="78.6" font-size="13.5" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">1 环境检查</tspan></text><text x="300.0" y="99.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">systemd · ffmpeg · Python 3.12 · Node ≥ 20 · nginx</tspan></text><rect x="40" y="121" width="520" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="300.0" y="139.6" font-size="13.5" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">2 服务用户与目录</tspan></text><text x="300.0" y="160.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">创建 copernicus 用户；建数据目录、venv、models 目录</tspan></text><rect x="40" y="182" width="520" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="300.0" y="200.6" font-size="13.5" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">3 生成 .env</tspan></text><text x="300.0" y="221.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">已有则保留；否则由 .env.prod 生成，写入上传目录与 CORS</tspan></text><rect x="40" y="243" width="520" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="300.0" y="262.2" font-size="13.5" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">4 后端环境</tspan></text><text x="300.0" y="282.1" font-size="10.144927536231883" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">venv → 先装 PyTorch（CUDA 12.1，--cpu 用 CPU 版）→ 装项目 → 打 FunASR 补丁</tspan></text><rect x="40" y="304" width="520" height="56" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="300.0" y="323.0" font-size="13.5" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">5 模型</tspan></text><text x="300.0" y="343.1" font-size="10.37037037037037" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">检查 ASR / YOLO / ChatTTS 文件；--download-models 联网下载 ASR + MacBERT</tspan></text><rect x="40" y="365" width="520" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="300.0" y="383.6" font-size="13.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">6 前端构建与发布</tspan></text><text x="300.0" y="404.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">npm ci + build → 复制到 /var/www/copernicus（先写临时目录再改名）</tspan></text><rect x="40" y="426" width="520" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="300.0" y="444.6" font-size="13.5" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">7 systemd 服务</tspan></text><text x="300.0" y="465.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">渲染单元文件 → 校验 → 启用并重启</tspan></text><rect x="40" y="487" width="520" height="56" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="300.0" y="505.6" font-size="13.5" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">8 Nginx</tspan></text><text x="300.0" y="526.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">渲染配置 → nginx -t 校验，失败自动回滚旧配置</tspan></text><rect x="40" y="548" width="520" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="300.0" y="566.6" font-size="13.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="300.0" dy="0.0">9 健康检查</tspan></text><text x="300.0" y="587.1" font-size="11" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="300.0" dy="0.0">轮询 /api/v1/health/live，最多约 3 分钟；超时给出日志命令</tspan></text><path d="M300,116 L300,121" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,177 L300,182" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,238 L300,243" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,299 L300,304" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,360 L300,365" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,421 L300,426" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,482 L300,487" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M300,543 L300,548" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="610" y="20" width="330" height="600" rx="14" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="7 5"/><text x="624" y="34.0" font-size="12.5" text-anchor="start" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="624" dy="0.0">sudo deploy/uninstall.sh</tspan></text><rect x="630" y="60" width="290" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="775.0" y="97.4" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="775.0" dy="0.0">默认移除</tspan></text><text x="775.0" y="117.2" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="775.0" dy="0.0">停止并删除 systemd 服务</tspan><tspan x="775.0" dy="12.8">删除 Nginx 配置并重载</tspan><tspan x="775.0" dy="12.8">删除前端发布目录</tspan><tspan x="775.0" dy="12.8">（部署参数读取自 /etc/copernicus/deploy.conf）</tspan></text><rect x="630" y="210" width="290" height="100" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="775.0" y="236.6" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="775.0" dy="0.0">按需加选项</tspan></text><text x="775.0" y="257.2" font-size="10.570987654320986" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="775.0" dy="0.0">--purge-env  删 venv / node_modules</tspan><tspan x="775.0" dy="14.3">--purge-data  删上传与全部任务结果</tspan><tspan x="775.0" dy="14.3">--remove-user  删服务用户（仅当由脚本创建）</tspan></text><rect x="630" y="330" width="290" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="775.0" y="377.9" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="775.0" dy="0.0">永远不动</tspan></text><text x="775.0" y="398.9" font-size="11.192810457516341" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="775.0" dy="0.0">代码仓库本身 · backend/.env · 模型文件</tspan><tspan x="775.0" dy="15.1">Ollama · NVIDIA 驱动 · ffmpeg</tspan></text><rect x="630" y="480" width="290" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="775.0" y="509.7" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="775.0" dy="0.0">安全措施</tspan></text><text x="775.0" y="530.9" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="775.0" dy="0.0">删除目录前展示目标并确认（-y 跳过）</tspan><tspan x="775.0" dy="15.5">拒绝删除 / /home /opt 等危险路径</tspan><tspan x="775.0" dy="15.5">--dry-run 只打印不执行</tspan></text></svg>
