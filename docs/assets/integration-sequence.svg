<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">第三方集成的典型调用顺序</title><desc id="d">提交音视频，轮询任务状态，读取结果；可选地提交合规审核、复核违规、导出报告和合成音频</desc><defs><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="709" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="30" y="16" width="220" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="140.0" y="38.0" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="140.0" dy="0.0">集成方系统</tspan></text><path d="M140,60 L140,655" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 4"/><rect x="370" y="16" width="220" height="44" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="480.0" y="38.0" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="480.0" dy="0.0">Copernicus API</tspan></text><path d="M480,60 L480,655" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 4"/><rect x="710" y="16" width="220" height="44" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="820.0" y="38.0" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="820.0" dy="0.0">后台处理（GPU / LLM）</tspan></text><path d="M820,60 L820,655" fill="none" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 4"/><path d="M140,100 L480,100" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="183.9" y="78.4" width="252.3" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="87.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">① POST /tasks/standard_minutes（文件）</tspan></text><path d="M480,134 L140,134" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m16a34a)"/><rect x="152.6" y="112.4" width="314.8" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="121.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">202 + task_id（同一文件已处理过 → existing=true）</tspan></text><path d="M480,168 L820,168" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><rect x="563.4" y="146.4" width="173.1" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="650.0" y="155.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="650.0" dy="0.0">排队 → 转写 → 纠正 → 纪要</tspan></text><path d="M140,210 L480,210" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="204.6" y="188.4" width="210.9" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="197.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">② GET /tasks/{id}（每 2 秒左右）</tspan></text><path d="M480,244 L140,244" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m16a34a)"/><rect x="225.5" y="222.4" width="169.0" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="231.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">status + progress.percent</tspan></text><path d="M140,286 L480,286" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="144.5" y="264.4" width="330.9" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="273.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">③ GET /tasks/{id}/results（status = completed 后）</tspan></text><path d="M480,320 L140,320" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m16a34a)"/><rect x="219.5" y="298.4" width="181.0" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="307.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">转写 + 纪要 + 合规 + 媒体信息</tspan></text><rect x="20" y="346" width="920" height="190" rx="14" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="360.0" font-size="12.5" text-anchor="start" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">可选：合规审核（视频还可先勾选“视觉扫描”）</tspan></text><path d="M140,398 L480,398" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="96.5" y="376.4" width="427.1" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="385.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">④ POST /tasks/compliance_audit（规则文件 + 转写 + parent_task_id）</tspan></text><path d="M480,432 L140,432" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m16a34a)"/><rect x="147.5" y="410.4" width="324.9" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="419.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">202 + 审核任务 id，同样轮询 GET /tasks/{审核任务 id}</tspan></text><path d="M140,472 L480,472" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="116.5" y="450.4" width="387.0" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="459.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">⑤ PATCH /tasks/{id}/compliance/violations（复核）→ 最新评分</tspan></text><path d="M140,512 L480,512" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="162.5" y="490.4" width="295.0" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="499.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">⑥ GET /tasks/{id}/compliance/export → Excel</tspan></text><rect x="20" y="552" width="920" height="100" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="566.0" font-size="12.5" text-anchor="start" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">可选：音频重塑</tspan></text><path d="M140,602 L480,602" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="94.4" y="580.4" width="431.2" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="589.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">⑦ POST /tasks/{id}/synthesize → 202；GET …/synthesis/status 轮询</tspan></text><path d="M480,634 L140,634" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m16a34a)"/><rect x="156.7" y="612.4" width="306.5" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="310.0" y="621.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="310.0" dy="0.0">completed 后 GET /tasks/{id}/synthesis 下载 MP3</tspan></text><text x="480" y="684.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">错误：429 队列已满（稍后重试）· 409 任务正忙 · 413 文件过大 · 422 参数不合法 · 404 任务不存在。所有错误体都带 request_id。</tspan></text></svg>
