<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">LLM 客户端结构</title><desc id="d">工厂按配置创建 Ollama 或 OpenAI 兼容客户端，基类提供全局并发限流与指数退避重试</desc><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="120" width="170" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="105.0" y="142.5" font-size="12.581699346405228" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="105.0" dy="0.0">create_llm_client</tspan></text><text x="105.0" y="162.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="105.0" dy="0.0">按 LLM_PROVIDER</tspan><tspan x="105.0" dy="15.5">选择协议</tspan></text><rect x="250" y="40" width="200" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="350.0" y="62.5" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="350.0" dy="0.0">OllamaClient</tspan></text><text x="350.0" y="83.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="350.0" dy="0.0">原生 /api/chat 流式协议</tspan><tspan x="350.0" dy="15.5">num_ctx · keep_alive</tspan></text><rect x="250" y="200" width="200" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="350.0" y="222.5" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="350.0" dy="0.0">OpenAI 兼容客户端</tspan></text><text x="350.0" y="243.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="350.0" dy="0.0">/chat/completions 流式</tspan><tspan x="350.0" dy="15.5">DeepSeek · vLLM · 云端</tspan></text><path d="M190,160 L220,160 L220,80 L250,80" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M190,160 L220,160 L220,240 L250,240" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="500" y="30" width="440" height="270" rx="14" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/><text x="514" y="44.0" font-size="12.5" text-anchor="start" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="514" dy="0.0">LLMClient 基类（两种客户端共用）</tspan></text><rect x="520" y="70" width="400" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="720.0" y="88.2" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="720.0" dy="0.0">全局并发信号量</tspan></text><text x="720.0" y="109.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="720.0" dy="0.0">LLM_MAX_CONCURRENT = 3，所有调用共享</tspan></text><rect x="520" y="140" width="400" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="720.0" y="157.5" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="720.0" dy="0.0">指数退避重试</tspan></text><text x="720.0" y="178.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="720.0" dy="0.0">LLM_MAX_RETRIES 次，间隔 LLM_RETRY_DELAY × 2ⁿ</tspan><tspan x="720.0" dy="15.5">重试：读/连接超时、连接错误、协议中断、5xx、429</tspan></text><rect x="520" y="224" width="400" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="720.0" y="242.2" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="720.0" dy="0.0">不重试</tspan></text><text x="720.0" y="263.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="720.0" dy="0.0">其他 4xx（鉴权、参数错误）立即向上抛出</tspan></text><path d="M450,80 L500,80" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><path d="M450,240 L500,240" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/></svg>
