<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">任务进度百分比与状态的对应关系</title><desc id="d">0-5% 抽帧，5-20% 视觉扫描，20% 语音识别，20-90% 文本纠正，90-100% 生成纪要</desc><defs></defs><rect x="0.5" y="0.5" width="959" height="199" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="480" y="26.0" font-size="13" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="480" dy="0.0">前端进度条的百分比由后端按状态与批次进度换算</tspan></text><rect x="40.0" y="60" width="44.0" height="44" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="62.0" y="82.0" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="62.0" dy="0.0">抽帧</tspan></text><rect x="84.0" y="60" width="132.0" height="44" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="150.0" y="82.0" font-size="12" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="150.0" dy="0.0">视觉扫描</tspan></text><rect x="221.28" y="60" width="610.72" height="44" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="526.64" y="82.0" font-size="12" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="526.64" dy="0.0">文本纠正（按已完成批次线性推进）</tspan></text><rect x="832.0" y="60" width="88.0" height="44" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="876.0" y="82.0" font-size="12" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="876.0" dy="0.0">生成纪要</tspan></text><rect x="214.0" y="60" width="18" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="223.0" y="82.0" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="223.0" dy="0.0"></tspan></text><text x="223.0" y="114.2" font-size="11.5" text-anchor="middle" fill="#166534" font-weight="normal" dominant-baseline="central"><tspan x="223.0" dy="0.0">语音识别</tspan><tspan x="223.0" dy="15.5">固定 20%</tspan></text><text x="40.0" y="148.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="40.0" dy="0.0">0%</tspan></text><text x="84.0" y="148.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="84.0" dy="0.0">5%</tspan></text><text x="216.0" y="148.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="216.0" dy="0.0">20%</tspan></text><text x="832.0" y="148.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="832.0" dy="0.0">90%</tspan></text><text x="920.0" y="148.0" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="920.0" dy="0.0">100%</tspan></text><text x="480" y="180.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">音频任务没有抽帧与视觉扫描，直接从 20% 起步；纯文本评估、合规审核任务的百分比按各自批次计算（0-100%）</tspan></text></svg>
