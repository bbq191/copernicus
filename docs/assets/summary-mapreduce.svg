<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">纪要生成：Map-Reduce</title><desc id="d">短文本单次评估；长文本先分段提取要点再合并，按模板提示词生成标题与正文</desc><defs><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="mca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="30" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="110.0" y="47.5" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="110.0" dy="0.0">转写全文</tspan></text><text x="110.0" y="68.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="110.0" dy="0.0">超过 50000 字截断</tspan><tspan x="110.0" dy="15.5">并标记“未完整”</tspan></text><rect x="240" y="30" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="340.0" y="55.2" font-size="14" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="340.0" dy="0.0">≤ 6000 字？</tspan></text><text x="340.0" y="76.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="340.0" dy="0.0">是 → 直接单次评估</tspan></text><path d="M200,65 L240,65" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M340,100 L340,150" fill="none" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#mca8a04)"/><rect x="345.2" y="116.4" width="19.5" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="355" y="125.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="355" dy="0.0">否</tspan></text><rect x="240" y="150" width="200" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="340.0" y="167.5" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="340.0" dy="0.0">Map：分段提取要点</tspan></text><text x="340.0" y="188.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="340.0" dy="0.0">每段 ≤ 6000 字，并发</tspan><tspan x="340.0" dy="15.5">受全局 LLM 并发限制</tspan></text><rect x="490" y="150" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="590.0" y="167.5" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="590.0" dy="0.0">某段失败</tspan></text><text x="590.0" y="188.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="590.0" dy="0.0">改用该段前 500 字原文</tspan><tspan x="590.0" dy="15.5">计入 degraded_chunks</tspan></text><path d="M440,185 L490,185" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mdc2626)"/><rect x="490" y="30" width="210" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="595.0" y="47.5" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="595.0" dy="0.0">Reduce：套用模板</tspan></text><text x="595.0" y="68.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="595.0" dy="0.0">模板提示词 + 全部要点</tspan><tspan x="595.0" dy="15.5">输出 JSON：title + 正文</tspan></text><path d="M440,65 L490,65" fill="none" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#mca8a04)"/><rect x="455.2" y="39.4" width="19.5" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="465" y="48.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="465" dy="0.0">是</tspan></text><path d="M340,220 L340,250 L595,250 L595,100" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><rect x="750" y="30" width="190" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="845.0" y="47.5" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="845.0" dy="0.0">evaluation.json</tspan></text><text x="845.0" y="68.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="845.0" dy="0.0">标题 + Markdown 正文</tspan><tspan x="845.0" dy="15.5">保存在任务目录</tspan></text><path d="M700,65 L750,65" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#mea580c)"/><rect x="750" y="150" width="190" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="845.0" y="167.5" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="845.0" dy="0.0">前端展示</tspan></text><text x="845.0" y="188.7" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="845.0" dy="0.0">不完整时显示警示条：</tspan><tspan x="845.0" dy="15.5">被截断 / 有片段降级</tspan></text><path d="M845,100 L845,150" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><text x="480" y="296.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">模板是 templates/ 下的 Markdown 文件（YAML 头 + 提示词正文），可热重载；上传时选择，也可在结果页切换后重新评估</tspan></text></svg>
