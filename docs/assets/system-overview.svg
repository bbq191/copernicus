le" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="520.0" dy="0.0">任务调度 TaskStore</tspan></text><text x="520.0" y="215.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="520.0" dy="0.0">排队上限 · 状态 · 取消 · 恢复</tspan></text><rect x="395" y="255" width="250" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="275.6" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="520.0" dy="0.0">处理服务</tspan></text><text x="520.0" y="295.4" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="520.0" dy="0.0">流水线 9 阶段 · 纪要评估 · 合规审核 · 音频重塑</tspan></text><rect x="395" y="335" width="250" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="354.2" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="520.0" dy="0.0">模型管理 ModelManager</tspan></text><text x="520.0" y="375.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="520.0" dy="0.0">使用锁 · ASR ↔ TTS 互斥</tspan></text><rect x="395" y="410" width="250" height="38" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="520.0" y="429.0" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="520.0" dy="0.0">生命周期清理（每小时）</tspan></text><path d="M520,153 L520,175" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M520,233 L520,255" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M520,313 L520,335" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><path d="M335,245 L370,245" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><rect x="335.1" y="219.4" width="33.8" height="1