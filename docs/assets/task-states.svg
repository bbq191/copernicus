<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">任务状态流转</title><desc id="d">任务从排队开始，经抽帧、视觉扫描、等待识别、语音识别、文本纠正、生成纪要到完成；合规审核是独立任务；失败与取消都落入 failed</desc><defs><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.5" y="0.5" width="959" height="539" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="20" y="70" width="102" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="71.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="71.0" dy="0.0">排队</tspan></text><text x="71.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="71.0" dy="0.0">pending</tspan></text><rect x="135" y="70" width="102" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="186.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="186.0" dy="0.0">抽帧</tspan></text><text x="186.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="186.0" dy="0.0">extracting_frames</tspan></text><rect x="250" y="70" width="102" height="64" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="301.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#134e4a" font-weight="600" dominant-baseline="central"><tspan x="301.0" dy="0.0">视觉扫描</tspan></text><text x="301.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="301.0" dy="0.0">scanning_visual</tspan></text><rect x="365" y="70" width="102" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="416.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="416.0" dy="0.0">等待识别</tspan></text><text x="416.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="416.0" dy="0.0">queued_asr</tspan></text><rect x="480" y="70" width="102" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="531.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="531.0" dy="0.0">语音识别</tspan></text><text x="531.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="531.0" dy="0.0">processing_asr</tspan></text><rect x="595" y="70" width="102" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="646.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="646.0" dy="0.0">文本纠正</tspan></text><text x="646.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="646.0" dy="0.0">correcting</tspan></text><rect x="710" y="70" width="102" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="761.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="761.0" dy="0.0">生成纪要</tspan></text><text x="761.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="761.0" dy="0.0">evaluating</tspan></text><rect x="825" y="70" width="102" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="876.0" y="93.6" font-size="13.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="876.0" dy="0.0">已完成</tspan></text><text x="876.0" y="113.1" font-size="9.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="876.0" dy="0.0">completed</tspan></text><path d="M122,102 L135,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M237,102 L250,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M352,102 L365,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M467,102 L480,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M582,102 L595,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M697,102 L710,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M812,102 L825,102" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M71,70 L71,40 L531,40 L531,70" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m64748b)"/><text x="480" y="22.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">音频文件：跳过抽帧与视觉扫描；仅当 ASR 被别的任务占用时才停在“等待识别”</tspan></text><text x="761" y="40.0" font-size="10.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="761" dy="0.0">仅转写（不含摘要）的任务在纠正后直接完成</tspan></text><path d="M646,70 L646,52 L876,52 L876,70" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m64748b)"/><rect x="370" y="220" width="220" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="480.0" y="240.2" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="480.0" dy="0.0">失败</tspan></text><text x="480.0" y="261.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480.0" dy="0.0">failed</tspan></text><path d="M531,134 L531,176 L480,176 L480,220" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mdc2626)"/><text x="516" y="158.0" font-size="11.5" text-anchor="end" fill="#7f1d1d" font-weight="normal" dominant-baseline="central"><tspan x="516" dy="0.0">任一阶段抛出异常 / 任务超时（3600 s，含排队）→ 失败；原因写入 failure.json</tspan></text><rect x="20" y="196" width="330" height="148" rx="14" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="210.0" font-size="12.5" text-anchor="start" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">取消  POST …/cancel</tspan></text><text x="36" y="234.0" font-size="9.5" text-anchor="start" fill="#7c2d12" font-weight="normal" dominant-baseline="central"><tspan x="36" dy="0.0">允许：排队 · 等待识别 · 文本纠正 · 生成纪要 · 合规审核</tspan></text><text x="36" y="258.0" font-size="10.964912280701753" text-anchor="start" fill="#7f1d1d" font-weight="normal" dominant-baseline="central"><tspan x="36" dy="0.0">不允许：抽帧 · 视觉扫描 · 语音识别（返回 409）</tspan></text><text x="36" y="287.1" font-size="11" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="36" dy="0.0">这些阶段跑在线程里，无法中断；强行取消会让线程继续</tspan><tspan x="36" dy="14.9">占用 GPU，同时放行下一个任务，造成显存冲突</tspan><tspan x="36" dy="14.9">（“等待识别”尚未碰 GPU，所以可以取消）</tspan></text><text x="480" y="314.0" font-size="11.5" text-anchor="middle" fill="#7f1d1d" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">被取消的任务同样进入失败，原因为“任务已取消”</tspan></text><text x="770" y="236.0" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="770" dy="0.0">服务重启后的恢复</tspan></text><text x="770" y="266.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="770" dy="0.0">磁盘上有转写结果 → 已完成</tspan><tspan x="770" dy="15.5">只剩媒体、没有结果 → 失败</tspan><tspan x="770" dy="15.5">（服务重启导致任务中断，可重新转写）</tspan></text><rect x="20" y="366" width="920" height="154" rx="14" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="380.0" font-size="12.5" text-anchor="start" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">合规审核是独立任务（不占音视频排队名额）</tspan></text><rect x="70" y="410" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="145.0" y="430.2" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="145.0" dy="0.0">排队</tspan></text><text x="145.0" y="451.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="145.0" dy="0.0">pending</tspan></text><rect x="290" y="410" width="150" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="365.0" y="430.2" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="365.0" dy="0.0">合规审核</tspan></text><text x="365.0" y="451.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="365.0" dy="0.0">auditing</tspan></text><rect x="510" y="410" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="585.0" y="430.2" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="585.0" dy="0.0">已完成</tspan></text><text x="585.0" y="451.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="585.0" dy="0.0">completed</tspan></text><rect x="730" y="410" width="150" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="805.0" y="430.2" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="600" dominant-baseline="central"><tspan x="805.0" dy="0.0">失败 / 取消</tspan></text><text x="805.0" y="451.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="805.0" dy="0.0">failed</tspan></text><path d="M220,440 L290,440" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M440,440 L510,440" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m64748b)"/><path d="M660,440 L730,440" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mdc2626)"/><text x="480" y="498.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">文本评估任务（evaluating）同理：独立任务，只走 排队 → 生成纪要 → 完成</tspan></text></svg>
