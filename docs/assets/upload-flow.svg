<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">文件上传流程</title><desc id="d">小文件走表单上传，大文件走分片断点续传；两条路径都先做哈希去重与队列容量检查，最后把媒体移入任务目录并启动流水线</desc><defs><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.5" y="0.5" width="959" height="619" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="330" y="16" width="300" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="29.2" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="600" dominant-baseline="central"><tspan x="480.0" dy="0.0">前端计算文件 SHA-256</tspan></text><text x="480.0" y="50.5" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480.0" dy="0.0">分块读取，不整体载入内存</tspan></text><path d="M390,62 L390,84 L215,84 L215,104" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="270.9" y="75.4" width="58.1" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="300" y="84.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="300" dy="0.0">≤ 20 MB</tspan></text><path d="M570,62 L570,84 L735,84 L735,104" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2563eb)"/><rect x="623.5" y="75.4" width="53.1" height="17.2" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="650" y="84.0" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="normal" dominant-baseline="central"><tspan x="650" dy="0.0">&gt; 20 MB</tspan></text><rect x="20" y="104" width="390" height="400" rx="14" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/><text x="34" y="118.0" font-size="12.5" text-anchor="start" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="34" dy="0.0">表单上传  POST /tasks/standard_minutes</tspan></text><rect x="45" y="140" width="340" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="215.0" y="156.2" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="215.0" dy="0.0">边收边写盘 + 计算哈希</tspan></text><text x="215.0" y="177.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="215.0" dy="0.0">临时文件 .incoming/，超过 500MB 立即 413</tspan></text><rect x="45" y="218" width="340" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="215.0" y="234.8" font-size="14" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="215.0" dy="0.0">哈希命中已有任务？</tspan></text><text x="215.0" y="255.5" font-size="10.714285714285715" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="215.0" dy="0.0">命中 → 丢弃临时文件，返回已有 task_id（existing）</tspan></text><rect x="45" y="296" width="340" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="215.0" y="312.4" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="215.0" dy="0.0">排队上限检查</tspan></text><text x="215.0" y="333.4" font-size="11.25" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="215.0" dy="0.0">音视频任务 ≥ TASK_MAX_ACTIVE → 429，稍后重试</tspan></text><rect x="45" y="374" width="340" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="215.0" y="390.2" font-size="14" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="215.0" dy="0.0">创建任务，占位登记哈希</tspan></text><text x="215.0" y="411.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="215.0" dy="0.0">同一文件的并发重复上传会命中这个占位</tspan></text><path d="M215,192 L215,218" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M215,270 L215,296" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M215,348 L215,374" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><rect x="550" y="104" width="390" height="400" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="7 5"/><text x="564" y="118.0" font-size="12.5" text-anchor="start" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="564" dy="0.0">分片上传  GET / PATCH /uploads/{hash}</tspan></text><rect x="575" y="140" width="340" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="745.0" y="156.2" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="745.0" dy="0.0">GET 预检</tspan></text><text x="745.0" y="177.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="745.0" dy="0.0">命中→已完成；否则创建/续用会话，返回断点偏移</tspan></text><rect x="575" y="218" width="340" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="745.0" y="234.2" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="745.0" dy="0.0">PATCH 逐块上传（5 MB/块）</tspan></text><text x="745.0" y="255.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="745.0" dy="0.0">Content-Range 定位；偏移不符 409；块过大 413</tspan></text><rect x="575" y="296" width="340" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="745.0" y="312.2" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="745.0" dy="0.0">末块到达前先查容量</tspan></text><text x="745.0" y="333.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="745.0" dy="0.0">满 → 429，块尚未写入，稍后原样重传</tspan></text><rect x="575" y="374" width="340" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="745.0" y="390.2" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="745.0" dy="0.0">校验整体哈希 → 创建任务</tspan></text><text x="745.0" y="411.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="745.0" dy="0.0">不一致 422 并丢弃会话；数据文件直接移动</tspan></text><path d="M745,192 L745,218" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><path d="M745,270 L745,296" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><path d="M745,348 L745,374" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#m7c3aed)"/><path d="M215,426 L215,470 L480,470 L480,526" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#m16a34a)"/><path d="M745,426 L745,470 L480,470" fill="none" stroke="#7c3aed" stroke-width="1.6"/><rect x="280" y="526" width="400" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="480.0" y="546.5" font-size="13.502109704641349" text-anchor="middle" fill="#1e293b" font-weight="600" dominant-baseline="central"><tspan x="480.0" dy="0.0">媒体移入任务目录 → 启动流水线 → 202 + task_id</tspan></text><text x="480.0" y="567.4" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480.0" dy="0.0">先落盘再启动：流水线第一步就会读文件，</tspan><tspan x="480.0" dy="15.5">先启动会读到写了一半的大文件</tspan></text></svg>
