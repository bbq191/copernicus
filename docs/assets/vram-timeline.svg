<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" role="img" aria-labelledby="t d"><title id="t">GPU 显存占用与模型切换</title><desc id="d">空闲时只有 ASR 常驻；本机 LLM 由 Ollama 按调用加载并立即释放；音频重塑时卸载 ASR、加载 TTS，结束后都释放</desc><defs></defs><rect x="0.5" y="0.5" width="959" height="544" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="480" y="22.0" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="480" dy="0.0">典型占用估算（RTX 2080 Ti 11GB + qwen3:7B Q4_K_M，数值为量级参考，以 nvidia-smi 为准）</tspan></text><text x="30" y="82.0" font-size="13" text-anchor="start" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="30" dy="0.0">空闲</tspan></text><rect x="250" y="60" width="640" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><rect x="250.0" y="60" width="261.8181818181818" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="380.9090909090909" y="82.0" font-size="11.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="380.9090909090909" dy="0.0">ASR 常驻 ≈4.5GB</tspan></text><text x="250" y="122.0" font-size="11.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="250" dy="0.0">服务启动即加载 ASR，之后一直驻留；LLM 已释放（OLLAMA_KEEP_ALIVE=0）</tspan></text><text x="30" y="172.0" font-size="13" text-anchor="start" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="30" dy="0.0">转写 → 文本纠正</tspan></text><rect x="250" y="150" width="640" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><rect x="250.0" y="150" width="261.8181818181818" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="380.9090909090909" y="172.0" font-size="11.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="380.9090909090909" dy="0.0">ASR ≈4.5</tspan></text><rect x="511.8181818181818" y="150" width="261.8181818181818" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="642.7272727272727" y="172.0" font-size="11.5" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="642.7272727272727" dy="0.0">LLM 权重 ≈4.5</tspan></text><rect x="773.6363636363636" y="150" width="116.36363636363636" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="831.8181818181818" y="172.0" font-size="11.5" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="831.8181818181818" dy="0.0">KV ≈2</tspan></text><text x="250" y="212.0" font-size="11.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="250" dy="0.0">LLM 只在调用期间由 Ollama 加载，调用结束立即释放；num_ctx 调小可降低 KV</tspan></text><text x="30" y="262.0" font-size="13" text-anchor="start" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="30" dy="0.0">合规审核（本机 LLM）</tspan></text><rect x="250" y="240" width="640" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><rect x="250.0" y="240" width="261.8181818181818" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="380.9090909090909" y="262.0" font-size="11.5" text-anchor="middle" fill="#7c2d12" font-weight="600" dominant-baseline="central"><tspan x="380.9090909090909" dy="0.0">LLM 权重 ≈4.5</tspan></text><rect x="511.8181818181818" y="240" width="116.36363636363636" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="570.0" y="262.0" font-size="11.5" text-anchor="middle" fill="#713f12" font-weight="600" dominant-baseline="central"><tspan x="570.0" dy="0.0">KV ≈2</tspan></text><text x="250" y="302.0" font-size="11.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="250" dy="0.0">开始前先卸载 ASR，把显存让给 LLM；使用远端 LLM（OpenAI 兼容）时不卸载</tspan></text><text x="30" y="352.0" font-size="13" text-anchor="start" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="30" dy="0.0">音频重塑</tspan></text><rect x="250" y="330" width="640" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><rect x="250.0" y="330" width="232.72727272727272" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="366.3636363636364" y="352.0" font-size="11.5" text-anchor="middle" fill="#4c1d95" font-weight="600" dominant-baseline="central"><tspan x="366.3636363636364" dy="0.0">TTS ≈4.0</tspan></text><text x="250" y="392.0" font-size="11.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="250" dy="0.0">等 ASR 使用者结束 → 卸载 ASR → 加载 ChatTTS；合成完立即卸载 TTS</tspan></text><text x="30" y="442.0" font-size="13" text-anchor="start" fill="#475569" font-weight="600" dominant-baseline="central"><tspan x="30" dy="0.0">下一次转写</tspan></text><rect x="250" y="420" width="640" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><rect x="250.0" y="420" width="261.8181818181818" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="380.9090909090909" y="442.0" font-size="11.5" text-anchor="middle" fill="#14532d" font-weight="600" dominant-baseline="central"><tspan x="380.9090909090909" dy="0.0">ASR 重新加载 ≈4.5</tspan></text><text x="250" y="482.0" font-size="11.5" text-anchor="start" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="250" dy="0.0">ASR 被卸载后，下个转写任务自动重载（约 30-60 秒），健康检查此期间显示 degraded</tspan></text><text x="480" y="524.0" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="normal" dominant-baseline="central"><tspan x="480" dy="0.0">设计取舍：宁可多花几十秒重载模型，也不让 ASR、TTS、LLM 同时驻留导致 OOM；OLLAMA_KEEP_ALIVE=0 是有意设置</tspan></text></svg>
